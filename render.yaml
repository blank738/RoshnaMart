services:
  # ==========================================
  # Spring Boot Backend (Docker Web Service)
  # ==========================================
  - type: web
    name: roshnamart-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: ROSHNAMART_UPLOAD_DIR
        value: /app/uploads
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  # ==========================================
  # React + Vite Frontend (Free Static Site)
  # ==========================================
  - type: static
    name: roshnamart-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
