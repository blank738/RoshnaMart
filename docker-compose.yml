services:
  # ==========================================
  # MySQL Database Service
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: roshnamart-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: roshnamart_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - roshnamart-network

  # ==========================================
  # Spring Boot Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roshnamart-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/roshnamart_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      ROSHNAMART_UPLOAD_DIR: /app/uploads
      ROSHNAMART_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      ROSHNAMART_JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - roshnamart-network

  # ==========================================
  # React + Vite Frontend (Served via Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: roshnamart-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - roshnamart-network

volumes:
  mysql_data:
    name: roshnamart_mysql_data
  uploads_data:
    name: roshnamart_uploads_data

networks:
  roshnamart-network:
    name: roshnamart-network
    driver: bridge
